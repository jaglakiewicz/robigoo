<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===================== BASE (drawn first: behind boom) ===================== -->
    <!-- Tank -->
    <rect x="36" y="20" width="48" height="52" rx="10"
          fill="#4b9bbd" stroke="#23647a" stroke-width="2.6"/>

    <!-- Cap -->
    <rect x="52" y="14" width="16" height="7" rx="3"
          fill="#4b9bbd" stroke="#23647a" stroke-width="2.6"/>

    <!-- Liquid level -->
    <rect x="42" y="48" width="36" height="14" rx="6"
          fill="#23647a" opacity="0.18" stroke="none"/>

    <!-- Shine -->
    <path d="M 46 30 C 48 24, 56 22, 62 24 C 54 26, 50 30, 48 36 C 46 34, 45 32, 46 30 Z"
          fill="#e6f3f7" opacity="0.22" stroke="none"/>

    <!-- Frame / 3-point hitch (mounted) -->
    <g stroke="#23647a" stroke-width="2.6">
      <path d="M 44 72 L 60 86 L 76 72"/>
      <path d="M 44 72 L 36 84"/>
      <path d="M 76 72 L 84 84"/>
      <path d="M 60 72 L 60 86"/>
    </g>
    <g>
      <circle cx="36" cy="84" r="2.4" fill="#23647a"/>
      <circle cx="84" cy="84" r="2.4" fill="#23647a"/>
      <circle cx="60" cy="86" r="2.2" fill="#23647a"/>
    </g>


    <!-- ===================== BOOM (drawn last: in front) ===================== -->
    <!-- 3-section boom: top & bottom chords -->
    <path d="M 10 44 L 52 44 L 68 44 L 110 44" stroke="#23647a" stroke-width="4"/>
    <path d="M 12 50 L 52 50 L 68 50 L 108 50" stroke="#23647a" stroke-width="3.5"/>

    <!-- end markers -->
    <circle cx="10" cy="44" r="3.2" fill="#4b9bbd" stroke="#23647a" stroke-width="1.5"/>
    <circle cx="110" cy="44" r="3.2" fill="#4b9bbd" stroke="#23647a" stroke-width="1.5"/>

    <!-- hinges / folding points -->
    <g>
      <rect x="50" y="41" width="6" height="12" rx="2" fill="#4b9bbd" stroke="#23647a" stroke-width="1.5"/>
      <rect x="64" y="41" width="6" height="12" rx="2" fill="#4b9bbd" stroke="#23647a" stroke-width="1.5"/>
      <circle cx="53" cy="47" r="1.8" fill="#23647a"/>
      <circle cx="67" cy="47" r="1.8" fill="#23647a"/>
    </g>

    <!-- truss braces (simple, readable) -->
    <g stroke="#23647a" stroke-width="1.6" opacity="0.95">
      <path d="M 18 50 L 26 44 L 34 50 L 42 44 L 50 50"/>
      <!-- <path d="M 52 50 L 60 44 L 68 50"/> -->
      <path d="M 70 50 L 78 44 L 86 50 L 94 44 L 102 50"/>
    </g>

    <!-- Nozzles: clamps + stems + tips (each "dopięta" to bottom chord) -->
    <g>
      <!-- clamps -->
      <g fill="#4b9bbd" stroke="#23647a" stroke-width="1.2">
        <rect x="20" y="48.2" width="4" height="3.6" rx="1"/>
        <rect x="36" y="48.2" width="4" height="3.6" rx="1"/>
        <rect x="58" y="48.2" width="4" height="3.6" rx="1"/>
        <rect x="80" y="48.2" width="4" height="3.6" rx="1"/>
        <rect x="96" y="48.2" width="4" height="3.6" rx="1"/>
      </g>

      <!-- stems -->
      <g stroke="#23647a" stroke-width="2">
        <line x1="22" y1="52" x2="22" y2="58"/>
        <line x1="38" y1="52" x2="38" y2="58"/>
        <line x1="60" y1="52" x2="60" y2="58"/>
        <line x1="82" y1="52" x2="82" y2="58"/>
        <line x1="98" y1="52" x2="98" y2="58"/>
      </g>

      <!-- tips -->
      <g>
        <circle cx="22" cy="60" r="2.1" fill="#23647a"/>
        <circle cx="38" cy="60" r="2.1" fill="#23647a"/>
        <circle cx="60" cy="60" r="2.1" fill="#23647a"/>
        <circle cx="82" cy="60" r="2.1" fill="#23647a"/>
        <circle cx="98" cy="60" r="2.1" fill="#23647a"/>
      </g>
    </g>

    <!-- Spray cones -->
    <g fill="#4b9bbd" opacity="0.22" stroke="none">
      <path d="M 22 62 L 15 98 L 29 98 Z"/>
      <path d="M 38 62 L 31 100 L 45 100 Z"/>
      <path d="M 60 62 L 52 102 L 68 102 Z"/>
      <path d="M 82 62 L 75 100 L 89 100 Z"/>
      <path d="M 98 62 L 91 98 L 105 98 Z"/>
    </g>

  </g>
</svg>
