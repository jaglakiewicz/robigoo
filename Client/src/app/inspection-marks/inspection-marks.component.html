<h3 class="component-title">{{ 'marks.title' | text }}</h3>
<p class="component-subtitle">{{ 'marks.description' | text }}</p>

<table class="data-table">
  <thead>
    <tr>
      <th>{{ 'marks.columns.number' | text }}</th>
      <th>{{ 'marks.columns.vehicle' | text }}</th>
      <th>{{ 'marks.columns.issued' | text }}</th>
      <th>{{ 'marks.columns.expires' | text }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let mark of marks">
      <td>{{ mark.number }}</td>
      <td>{{ mark.vehicle }}</td>
      <td>{{ mark.issued }}</td>
      <td>{{ mark.expires }}</td>
    </tr>
  </tbody>
</table>
