<!-- Toast Notifications -->
<app-toast-notification></app-toast-notification>

<app-login *ngIf="!isLoggedIn" (loginSuccess)="handleLoginSuccess()"></app-login>

<ng-container *ngIf="isLoggedIn">
  <button class="hamburger" *ngIf="!sidebarOpen" (click)="toggle()" aria-label="Open menu">
    &#9776;
  </button>

  <div class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-close-row" *ngIf="sidebarOpen">
      <button class="close-btn" (click)="toggle()" aria-label="Close menu">&times;</button>
    </div>

    <ul class="menu" *ngIf="sidebarOpen">
      <li *ngFor="let item of menuItems" 
          (click)="openTab(item.type, item.titleKey)"
          [class.disabled]="isMasterAdmin() && item.type !== 'settings'"
          [class.restricted]="isMasterAdmin() && item.type !== 'settings'"
          [attr.title]="isMasterAdmin() && item.type !== 'settings' ? 'Master administrator može koristiti samo Settings' : null">
        <span class="menu-icon" [innerHTML]="getSafeHtml(iconMap[item.type])" aria-hidden="true"></span>
        <span>{{ item.titleKey | translate }}</span>
        <span class="hint">{{ item.hintKey | translate }}</span>
      </li>
    </ul>

    <div class="sidebar-footer" *ngIf="sidebarOpen">
      <div class="sidebar-footer-content">
        <div class="language-switcher">
          <span class="language-label">{{ 'language.label' | translate }}</span>
          <div class="language-options">
            <button
              *ngFor="let lang of languages"
              class="language-option"
              [class.active]="lang.code === currentLanguage"
              (click)="changeLanguage(lang.code)"
            >
              {{ lang.label }}
            </button>
          </div>
        </div>
        <button class="theme-toggle" (click)="toggleTheme()">
          <span>{{ 'theme.toggle' | translate }}</span>
          <small>{{ ('theme.mode.' + (darkMode ? 'light' : 'dark')) | translate }}</small>
        </button>
      </div>
    </div>
  </div>

  <div class="app-shell" [class.shifted]="sidebarOpen">
    <div class="container">
      <div class="top-bar">
        <div class="tabs" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="reorderTabs($event)">
          <div *ngFor="let t of tabs; let i = index" class="tab" cdkDrag cdkDragLockAxis="x" [class.active]="i === activeIndex" (click)="activateTab(i)">
            <span *ngIf="t.icon" class="tab-icon" [innerHTML]="getSafeHtml(t.icon)"></span>
            <span>{{ t.titleKey | translate }}</span>
            <button class="tab-action pin" title="Pin/Unpin tab" *ngIf="i === activeIndex || t.pinned" (click)="togglePinTab(i, $event)" [class.pinned]="t.pinned">
              <svg viewBox="0 0 410 410" fill="currentColor">
                <path d="M226.291627,7.10542736e-15 L407.374933,180.927147 L377.20832,211.114667 L347.02464,180.954453 L279.749973,248.22912 L260.812373,327.520853 L196.19776,392.125013 L120.76032,316.687573 L30.1691733,407.12512 L7.10542736e-15,407.12512 L7.10542736e-15,376.955947 L90.5898667,286.51712 L15.17696,211.104 L79.7706667,146.510293 L159.0624,127.562453 L226.30336,60.3306667 L196.135467,30.18752 L226.291627,7.10542736e-15 Z M256.481707,90.4859733 L180.708267,166.25024 L101.416533,185.19808 L75.5101867,211.104427 L196.19776,331.792 L222.104107,305.896107 L241.041707,226.59392 L316.845013,150.799787 L256.481707,90.4859733 Z"/>
              </svg>
            </button>
            <button class="tab-action close" title="Close tab" *ngIf="!t.pinned" (click)="closeTab(i); $event.stopPropagation()">
              <svg viewBox="0 0 244 244" fill="currentColor">
                <path d="M213.333333,2.84217094e-14 L243.503223,30.1698893 L151.921,121.751 L243.503223,213.333333 L213.333333,243.503223 L121.751,151.921 L30.1698893,243.503223 L2.84217094e-14,213.333333 L91.582,121.751 L2.84217094e-14,30.1698893 L30.1698893,2.84217094e-14 L121.751,91.582 L213.333333,2.84217094e-14 Z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="app-toolbar">
          <div class="toolbar-spacer"></div>
          <div class="user-menu" *ngIf="displayUserName" [class.open]="userMenuOpen">
            <button type="button" class="user-info-display" (click)="toggleUserMenu()" [attr.aria-expanded]="userMenuOpen">
              <span class="user-avatar" [ngClass]="{'has-image': userAvatar}" [style.backgroundImage]="userAvatar ? 'url(' + userAvatar + ')' : 'none'">
                <span *ngIf="!userAvatar" class="avatar-initials">{{ userInitials }}</span>
              </span>
              <span class="user-name-text">{{ displayUserName }}</span>
              <span class="user-chevron" [innerHTML]="getSafeHtml(userChevronSvg)"></span>
            </button>
            <div class="user-menu-dropdown" *ngIf="userMenuOpen">
              <div class="user-menu-item user-menu-info">
                <span class="user-menu-label">{{ 'userMenu.loggedInAs' | translate }}</span>
                <div class="user-menu-chip">
                  <span class="user-avatar small" [ngClass]="{'has-image': userAvatar}" [style.backgroundImage]="userAvatar ? 'url(' + userAvatar + ')' : 'none'">
                    <span *ngIf="!userAvatar" class="avatar-initials">{{ userInitials }}</span>
                  </span>
                  <span class="user-name">{{ displayUserName }}</span>
                </div>
              </div>
              <div class="user-menu-divider"></div>
              <div class="user-menu-item" (click)="editUser()">{{ 'userMenu.edit' | translate }}</div>
              <div class="user-menu-item" (click)="onLogout()">{{ 'userMenu.logout' | translate }}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="main-area">
        <ng-container *ngIf="tabs.length; else noTabs">
          <ng-container [ngSwitch]="tabs[activeIndex]?.type">
            <app-new-inspection *ngSwitchCase="'new'" (close)="closeTab(activeIndex)"></app-new-inspection>
            <app-inspections *ngSwitchCase="'inspections'"></app-inspections>
            <app-clients *ngSwitchCase="'clients'"></app-clients>
            <app-inspection-marks *ngSwitchCase="'marks'"></app-inspection-marks>
            <app-notifications *ngSwitchCase="'notifications'"></app-notifications>
            <app-types-of-vehicles *ngSwitchCase="'types'"></app-types-of-vehicles>
            <app-statistics *ngSwitchCase="'stats'"></app-statistics>
            <app-settings *ngSwitchCase="'settings'"></app-settings>
          </ng-container>
        </ng-container>
      </div>
    </div>
  </div>
</ng-container>
