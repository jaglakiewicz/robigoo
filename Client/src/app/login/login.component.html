  <div class="login-box">
    <div class="login-header">
      <div class="robigoo-logo" aria-label="Robigoo">
        <div class="logo-container">
          <div class="logo-icon">
            <svg viewBox="0 0 120 120" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <g fill="none" stroke-linecap="round" stroke-linejoin="round">

                <!-- Spray mist particles (left side - going down and left) -->
                <g class="spray-particles spray-particles-left">
                  <circle cx="22" cy="70" r="1" class="spray-drop" />
                  <circle cx="38" cy="75" r="1.2" class="spray-drop" />
                  <circle cx="15" cy="85" r="0.8" class="spray-drop" />
                  <circle cx="28" cy="82" r="0.6" class="spray-drop" />
                  <circle cx="42" cy="88" r="0.9" class="spray-drop" />
                </g>
                
                <!-- Spray mist particles (right side - going down and right) -->
                <g class="spray-particles spray-particles-right">
                  <circle cx="98" cy="70" r="1" class="spray-drop" />
                  <circle cx="82" cy="75" r="1.2" class="spray-drop" />
                  <circle cx="105" cy="85" r="0.8" class="spray-drop" />
                  <circle cx="92" cy="82" r="0.6" class="spray-drop" />
                  <circle cx="78" cy="88" r="0.9" class="spray-drop" />
                </g>
                
                <!-- Center spray particles -->
                <g class="spray-particles spray-particles-center">
                  <circle cx="60" cy="78" r="1.1" class="spray-drop" />
                  <circle cx="55" cy="85" r="0.8" class="spray-drop" />
                  <circle cx="65" cy="85" r="0.8" class="spray-drop" />
                  <circle cx="60" cy="92" r="0.7" class="spray-drop" />
                </g>

                <!-- ===================== BASE (drawn first: behind boom) ===================== -->
                <!-- Main tank body -->
                <g class="sprayer-tank-main">
                  <rect x="36" y="20" width="48" height="52" rx="10" class="tank-fill" />
                  <rect x="36" y="20" width="48" height="52" rx="10" class="tank-outline" />
                </g>

                <!-- Tank cap/fill opening -->
                <g class="tank-cap-main">
                  <rect x="52" y="14" width="16" height="7" rx="3" class="cap-body" />
                </g>

                <!-- Liquid level indicator inside tank -->
                <g class="liquid-level" opacity="0.4">
                  <rect x="42" y="48" width="36" height="14" rx="6" class="liquid-fill" />
                </g>

                <!-- Decorative highlight/shine effect -->
                <g class="shine-effect">
                  <path d="M 46 30 C 48 24, 56 22, 62 24 C 54 26, 50 30, 48 36 C 46 34, 45 32, 46 30 Z" fill="#e6f3f7" opacity="0.6" />
                </g>

                <!-- Support legs / Frame / 3-point hitch -->
                <g class="support-legs">
                  <path d="M 44 72 L 60 86 L 76 72" class="leg-line" />
                  <path d="M 44 72 L 36 84" class="leg-line" />
                  <path d="M 76 72 L 84 84" class="leg-line" />
                  <path d="M 60 72 L 60 86" class="leg-line" />
                  <circle cx="36" cy="84" r="2.4" class="leg-joint" />
                  <circle cx="84" cy="84" r="2.4" class="leg-joint" />
                  <circle cx="60" cy="86" r="2.2" class="leg-joint" />
                </g>

                <!-- ===================== BOOM (drawn last: in front) ===================== -->
                <!-- Horizontal boom arm (spread bar) -->
                <g class="boom-arm">
                  <path d="M 10 44 L 52 44 L 68 44 L 110 44" stroke-width="4" class="boom-line" />
                  <path d="M 12 50 L 52 50 L 68 50 L 108 50" stroke-width="3.5" class="boom-line" />
                  <!-- Boom end markers -->
                  <circle cx="10" cy="44" r="3.2" class="boom-joint" />
                  <circle cx="110" cy="44" r="3.2" class="boom-joint" />
                  <!-- Hinges / folding points -->
                  <rect x="50" y="41" width="6" height="12" rx="2" class="boom-hinge" />
                  <rect x="64" y="41" width="6" height="12" rx="2" class="boom-hinge" />
                  <circle cx="53" cy="47" r="1.8" class="boom-hinge-dot" />
                  <circle cx="67" cy="47" r="1.8" class="boom-hinge-dot" />
                  <!-- Truss braces -->
                  <path d="M 18 50 L 26 44 L 34 50 L 42 44 L 50 50" stroke-width="1.6" class="boom-truss" />
                  <path d="M 70 50 L 78 44 L 86 50 L 94 44 L 102 50" stroke-width="1.6" class="boom-truss" />
                </g>

                <!-- Nozzles -->
                <g class="nozzle-group nozzle-left">
                  <!-- Nozzle 1 (leftmost) -->
                  <rect x="20" y="48.2" width="4" height="3.6" rx="1" class="nozzle-clamp" />
                  <line x1="22" y1="52" x2="22" y2="58" stroke-width="2" class="nozzle-tube" />
                  <circle cx="22" cy="60" r="2.1" class="nozzle-body" />
                  <g class="mist-trail mist-trail-1">
                    <path d="M 22 62 L 15 98 L 29 98 Z" class="mist-cone" />
                  </g>
                  
                  <!-- Nozzle 2 -->
                  <rect x="36" y="48.2" width="4" height="3.6" rx="1" class="nozzle-clamp" />
                  <line x1="38" y1="52" x2="38" y2="58" stroke-width="2" class="nozzle-tube" />
                  <circle cx="38" cy="60" r="2.1" class="nozzle-body" />
                  <g class="mist-trail mist-trail-2">
                    <path d="M 38 62 L 31 100 L 45 100 Z" class="mist-cone" />
                  </g>
                </g>

                <!-- Center nozzle -->
                <g class="nozzle-group nozzle-center">
                  <rect x="58" y="48.2" width="4" height="3.6" rx="1" class="nozzle-clamp" />
                  <line x1="60" y1="52" x2="60" y2="58" stroke-width="2" class="nozzle-tube" />
                  <circle cx="60" cy="60" r="2.1" class="nozzle-body" />
                  <g class="mist-trail mist-trail-3">
                    <path d="M 60 62 L 52 102 L 68 102 Z" class="mist-cone" />
                  </g>
                </g>

                <g class="nozzle-group nozzle-right">
                  <!-- Nozzle 4 -->
                  <rect x="80" y="48.2" width="4" height="3.6" rx="1" class="nozzle-clamp" />
                  <line x1="82" y1="52" x2="82" y2="58" stroke-width="2" class="nozzle-tube" />
                  <circle cx="82" cy="60" r="2.1" class="nozzle-body" />
                  <g class="mist-trail mist-trail-4">
                    <path d="M 82 62 L 75 100 L 89 100 Z" class="mist-cone" />
                  </g>
                  
                  <!-- Nozzle 5 (rightmost) -->
                  <rect x="96" y="48.2" width="4" height="3.6" rx="1" class="nozzle-clamp" />
                  <line x1="98" y1="52" x2="98" y2="58" stroke-width="2" class="nozzle-tube" />
                  <circle cx="98" cy="60" r="2.1" class="nozzle-body" />
                  <g class="mist-trail mist-trail-5">
                    <path d="M 98 62 L 91 98 L 105 98 Z" class="mist-cone" />
                  </g>
                </g>

              </g>
            </svg>
          </div>
          
          <div class="logo-text">
            <div class="logo-wordmark-container">
              <span class="logo-wordmark">ROBIGOO</span>
              <span class="logo-tagline">Stacja Kontroli Opryskiwaczy</span>
            </div>
            <span class="logo-version">v. 1.0</span>
          </div>
        </div>
      </div>
      <div class="login-separator" aria-hidden="true"></div>
    </div>

    <div class="login-form">
      <div *ngIf="errorKey" class="error-message">{{ errorKey | text }}</div>
      <div *ngIf="logoutMessage" class="info-message">{{ logoutMessage }}</div>

      <div class="form-group">
        <label for="username">{{ 'login.username' | text }}</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          (keypress)="onKeyPress($event)"
          [placeholder]="'login.usernamePlaceholder' | text"
          [disabled]="loading"
        />
      </div>

      <div class="form-group password-group">
        <label for="password">{{ 'login.password' | text }}</label>
        <div class="password-field">
          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            [(ngModel)]="password"
            (keypress)="onKeyPress($event)"
            [placeholder]="'login.passwordPlaceholder' | text"
            [disabled]="loading"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="(passwordVisible ? 'login.passwordHide' : 'login.passwordShow') | text"
            [attr.title]="(passwordVisible ? 'login.passwordHide' : 'login.passwordShow') | text"
            [attr.aria-pressed]="passwordVisible"
          >
            <svg *ngIf="!passwordVisible" viewBox="0 0 426.666667 341.333333" focusable="false" aria-hidden="true">
              <path
                fill="currentColor"
                d="M213.333333,1.42108547e-14 C64,1.42108547e-14 7.10542736e-15,170.666667 7.10542736e-15,170.666667 C7.10542736e-15,170.666667 64,341.333333 213.333333,341.333333 C362.666667,341.333333 426.666667,170.666667 426.666667,170.666667 C426.666667,170.666667 362.666667,1.42108547e-14 213.333333,1.42108547e-14 Z M213.333333,298.666667 C119.071573,298.666667 64.7370667,207.3632 46.7136,170.67328 C64.7850667,133.88928 119.114667,42.6666667 213.333333,42.6666667 C307.595093,42.6666667 361.9296,133.970133 379.954347,170.658773 C361.8816,207.444053 307.552,298.666667 213.333333,298.666667 Z M213.333333,96 C172.096427,96 138.666667,129.42976 138.666667,170.666667 C138.666667,211.903573 172.096427,245.333333 213.333333,245.333333 C254.57024,245.333333 288,211.903573 288,170.666667 C288,129.42976 254.57024,96 213.333333,96 Z M213.333333,202.666667 C195.688747,202.666667 181.333333,188.311253 181.333333,170.666667 C181.333333,153.02208 195.688747,138.666667 213.333333,138.666667 C230.97792,138.666667 245.333333,153.02208 245.333333,170.666667 C245.333333,188.311253 230.97792,202.666667 213.333333,202.666667 Z"
              ></path>
            </svg>
            <svg *ngIf="passwordVisible" viewBox="0 0 426.666667 392.836561" focusable="false" aria-hidden="true">
              <path
                fill="currentColor"
                d="M47.0849493,2.84217094e-14 L185.740632,138.655563 C194.095501,134.657276 203.45297,132.418278 213.333333,132.418278 C248.679253,132.418278 277.333333,161.072358 277.333333,196.418278 C277.333333,206.299034 275.094157,215.656855 271.095572,224.011976 L409.751616,362.666662 L379.581717,392.836561 L320.374817,333.628896 C291.246618,353.329494 255.728838,367.084945 213.333333,367.084945 C64,367.084945 7.10542736e-15,196.418278 7.10542736e-15,196.418278 C7.10542736e-15,196.418278 22.862032,135.452859 73.1408088,86.3974274 L16.9150553,30.169894 L47.0849493,2.84217094e-14 Z M103.440016,116.694904 C74.7091717,144.512844 55.9626236,177.598744 46.7136,196.424891 C64.7370667,233.114811 119.071573,324.418278 213.333333,324.418278 C242.440012,324.418278 267.739844,315.712374 289.339919,302.595012 L240.926035,254.180993 C232.571166,258.17928 223.213696,260.418278 213.333333,260.418278 C177.987413,260.418278 149.333333,231.764198 149.333333,196.418278 C149.333333,186.537915 151.572331,177.180445 155.570618,168.825577 Z M213.333333,25.7516113 C362.666667,25.7516113 426.666667,196.418278 426.666667,196.418278 C426.666667,196.418278 412.428071,234.387867 381.712212,274.508373 L351.151213,243.941206 C364.581948,225.697449 374.142733,208.239347 379.954347,196.410385 C361.9296,159.721745 307.595093,68.418278 213.333333,68.418278 C201.495833,68.418278 190.287983,69.858232 179.702584,72.449263 L145.662385,38.4000762 C165.913597,30.494948 188.437631,25.7516113 213.333333,25.7516113 Z"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn-login" (click)="onLogin()" [disabled]="loading">
        {{ loading ? ('login.submitting' | text) : ('login.submit' | text) }}
      </button>

      <div class="demo-hint">
        {{ 'login.demoHint' | text }}
      </div>
    </div>
  </div>

  <!-- Session conflict dialog -->
  <div *ngIf="sessionConflictVisible" class="dialog-backdrop" aria-modal="true" role="dialog">
    <div class="dialog">
      <h2 class="dialog__title">{{ 'login.submit' | text }}</h2>
      <div class="dialog__body">
        <p>{{ 'login.sessionConflict.message' | text }}</p>
        <p>{{ 'login.sessionConflict.confirm' | text }}</p>
      </div>
      <div class="dialog__actions">
        <button type="button" class="btn btn-secondary" (click)="cancelSessionTakeover()">
          {{ 'login.sessionConflict.buttons.cancel' | text }}
        </button>
        <button type="button" class="btn btn-primary" (click)="confirmSessionTakeover()">
          {{ 'login.sessionConflict.buttons.takeOver' | text }}
        </button>
      </div>
    </div>
  </div>
</div>
