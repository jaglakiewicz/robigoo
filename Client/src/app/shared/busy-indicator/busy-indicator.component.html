<!-- Fullscreen Busy Indicator -->
<div class="busy-overlay busy-overlay--fullscreen" *ngIf="fullscreenIndicator">
  <div class="busy-content">
    <div class="busy-spinner busy-spinner--lg"></div>
    <span class="busy-message" *ngIf="fullscreenIndicator.message">
      {{ fullscreenIndicator.message }}
    </span>
  </div>
</div>
