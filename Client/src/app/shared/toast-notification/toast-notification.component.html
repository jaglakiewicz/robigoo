<div class="toasts-container">
  <div 
    *ngFor="let toast of toasts" 
    [ngClass]="getToastClass(toast)"
    @slideIn
    (click)="removeToast(toast.id)"
  >
    <span class="toast-icon" [innerHTML]="getIcon(toast.type)"></span>
    <span class="toast-message">{{ toast.message }}</span>
    <button class="toast-close" (click)="removeToast(toast.id); $event.stopPropagation()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
    </button>
  </div>
</div>
