<div class="filter-panel" [class.open]="isOpen">
  <!-- Toggle Button -->
  <button
    type="button"
    class="btn btn-secondary filter-toggle-btn"
    [class.active]="isOpen"
    [class.has-filters]="activeFilterCount > 0"
    (click)="toggle()">
    <span class="filter-icon" [innerHTML]="filterIcon"></span>
    <span class="filter-badge" *ngIf="activeFilterCount > 0">{{ activeFilterCount }}</span>
  </button>

  <!-- Mobile Backdrop -->
  <div class="filter-backdrop" *ngIf="isOpen" (click)="toggle()"></div>

  <!-- Dropdown Panel -->
  <div class="filter-dropdown" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="filter-body">
      <!-- Active filter rows -->
      <div class="filter-row" *ngFor="let filter of activeFilters; let i = index">
        <div class="filter-row-header">
          <span class="filter-row-label">{{ getFieldForFilter(filter)?.label }}</span>
          <button type="button" class="filter-row-remove" (click)="removeFilter(i)" aria-label="Usuń filtr">
            <span [innerHTML]="removeIcon"></span>
          </button>
        </div>
        <div class="filter-row-controls">
          <!-- Operator select -->
          <select
            class="filter-operator"
            [value]="filter.operator"
            (change)="onOperatorChange(i, $any($event.target).value)"
            *ngIf="getOperators(getFieldForFilter(filter)?.type || 'text').length > 1">
            <option *ngFor="let op of getOperators(getFieldForFilter(filter)?.type || 'text')" [value]="op.value">{{ op.label }}</option>
          </select>

          <!-- Value input: TEXT -->
          <input
            *ngIf="getFieldForFilter(filter)?.type === 'text'"
            type="text"
            class="filter-value-input"
            [value]="filter.value"
            (input)="onValueChange(i, $any($event.target).value)"
            placeholder="Wpisz wartość..." />

          <!-- Value input: NUMBER -->
          <input
            *ngIf="getFieldForFilter(filter)?.type === 'number' && filter.operator !== 'between'"
            type="number"
            class="filter-value-input"
            [value]="filter.value"
            [min]="getFieldForFilter(filter)?.min"
            [max]="getFieldForFilter(filter)?.max"
            [step]="getFieldForFilter(filter)?.step || 1"
            (input)="onValueChange(i, $any($event.target).value)" />

          <!-- Value input: NUMBER BETWEEN -->
          <ng-container *ngIf="getFieldForFilter(filter)?.type === 'number' && filter.operator === 'between'">
            <div class="filter-between-inputs">
              <input
                type="number"
                class="filter-value-input"
                [value]="filter.value"
                [min]="getFieldForFilter(filter)?.min"
                [max]="getFieldForFilter(filter)?.max"
                [step]="getFieldForFilter(filter)?.step || 1"
                (input)="onValueChange(i, $any($event.target).value)"
                placeholder="Od" />
              <span class="filter-between-sep">–</span>
              <input
                type="number"
                class="filter-value-input"
                [value]="filter.valueTo || ''"
                [min]="getFieldForFilter(filter)?.min"
                [max]="getFieldForFilter(filter)?.max"
                [step]="getFieldForFilter(filter)?.step || 1"
                (input)="onValueToChange(i, $any($event.target).value)"
                placeholder="Do" />
            </div>
          </ng-container>

          <!-- Value input: DATE -->
          <input
            *ngIf="getFieldForFilter(filter)?.type === 'date' && filter.operator !== 'between'"
            type="date"
            class="filter-value-input"
            [value]="filter.value"
            (change)="onValueChange(i, $any($event.target).value)" />

          <!-- Value input: DATE BETWEEN -->
          <ng-container *ngIf="getFieldForFilter(filter)?.type === 'date' && filter.operator === 'between'">
            <div class="filter-between-inputs">
              <input
                type="date"
                class="filter-value-input"
                [value]="filter.value"
                (change)="onValueChange(i, $any($event.target).value)" />
              <span class="filter-between-sep">–</span>
              <input
                type="date"
                class="filter-value-input"
                [value]="filter.valueTo || ''"
                (change)="onValueToChange(i, $any($event.target).value)" />
            </div>
          </ng-container>

          <!-- Value input: SELECT -->
          <select
            *ngIf="getFieldForFilter(filter)?.type === 'select' || getFieldForFilter(filter)?.type === 'boolean'"
            class="filter-value-input"
            [value]="filter.value"
            (change)="onValueChange(i, $any($event.target).value)">
            <option *ngFor="let opt of getFieldForFilter(filter)?.options" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>
      </div>

      <!-- Empty state -->
      <div class="filter-empty" *ngIf="activeFilters.length === 0">
        Brak aktywnych filtrów
      </div>

      <!-- Column picker -->
      <div class="filter-add-section">
        <button
          type="button"
          class="filter-add-btn"
          (click)="toggleColumnPicker()"
          [disabled]="availableColumns.length === 0">
          <span [innerHTML]="addIcon"></span>
          <span>Dodaj filtr</span>
        </button>

        <div class="column-picker" *ngIf="showColumnPicker && availableColumns.length > 0">
          <div
            class="column-option"
            *ngFor="let col of availableColumns"
            (click)="addFilter(col)">
            {{ col.label }}
          </div>
        </div>
      </div>
    </div>

    <div class="filter-footer">
      <button
        *ngIf="showClearButton && activeFilterCount > 0"
        type="button"
        class="btn btn-secondary"
        (click)="clearFilters()">
        {{ clearButtonLabel }}
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="applyFilters()">
        {{ applyButtonLabel }}
      </button>
    </div>
  </div>
</div>
