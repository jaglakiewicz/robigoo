<div class="dialog-backdrop dialog-backdrop--dismissible" (click)="onBackdropClick($event)">
  <div class="dialog dialog--lg" (click)="$event.stopPropagation()">
    <div class="dialog__header">
      <h2 class="dialog__title">Historia zmian</h2>
      <button class="dialog__close" (click)="onClose()" aria-label="Zamknij">&times;</button>
    </div>
    
    <div class="dialog__body dialog__body--scroll" appScrollFade>
      <div *ngIf="loading" class="loading">Ładowanie historii...</div>
      
      <div *ngIf="!loading && logs.length === 0" class="no-data">
        Brak historii zmian.
      </div>

      <table *ngIf="!loading && logs.length > 0" class="data-table text-sm">
        <thead>
          <tr>
            <th>Kiedy</th>
            <th>Kto</th>
            <th>Zmiany</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let log of logs">
            <td class="col-when">{{ log.when | date:'medium' }}</td>
            <td class="col-who">
              <div class="user-cell">
                <div class="user-avatar" *ngIf="!hasAvatar(log)" [innerHTML]="getSafeHtml(userIcon)"></div>
                <img class="user-avatar-img" *ngIf="hasAvatar(log)" [src]="getAvatarSrc(log)" alt="Avatar">
                <span>{{ getUserDisplayName(log) }}</span>
              </div>
            </td>
            <td class="col-changes" [innerHTML]="formatChanges(log.changes)"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
