<div class="dialog-backdrop dialog-backdrop--dismissible" (click)="onBackdropClick($event)">
  <div class="dialog dialog--lg" (click)="$event.stopPropagation()">
    <div class="dialog__header">
      <h2 class="dialog__title">Historia zmian</h2>
      <button class="dialog__close" (click)="onClose()" aria-label="Zamknij">&times;</button>
    </div>
    
    <div class="dialog__body dialog__body--scroll" appScrollFade>
      <div *ngIf="loading" class="loading">Ładowanie historii...</div>
      
      <div *ngIf="!loading && logs.length === 0" class="no-data">
        Brak historii zmian.
      </div>

      <div *ngIf="!loading && logs.length > 0" class="history-list">
        <div *ngFor="let log of logs; let last = last" class="history-item">
          <div class="history-header">
            <div class="user-info">
              <div class="user-avatar" *ngIf="!hasAvatar(log)" [innerHTML]="getSafeHtml(userIcon)"></div>
              <img class="user-avatar-img" *ngIf="hasAvatar(log)" [src]="getAvatarSrc(log)" alt="Avatar">
              <div>
                <div class="user-name">{{ getUserDisplayName(log) }}</div>
                <div class="timestamp">{{ log.when | date:'medium' }}</div>
              </div>
            </div>
            <div class="action-badge">{{ parseChanges(log.changes).action }}</div>
          </div>
          
          <table class="data-table">
            <thead>
              <tr>
                <th>Pole</th>
                <th>Wartość</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let field of parseChanges(log.changes).fields">
                <td>{{ field.label }}</td>
                <td>
                  <span *ngIf="!field.oldValue">{{ field.newValue }}</span>
                  <span *ngIf="field.oldValue" class="value-change">
                    <span class="old-value">{{ field.oldValue }}</span>
                    <span class="arrow-icon" [innerHTML]="getSafeHtml(arrowIcon)"></span>
                    <span class="new-value">{{ field.newValue }}</span>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          
          <div *ngIf="!last" class="history-separator"></div>
        </div>
      </div>
    </div>
  </div>
</div>
