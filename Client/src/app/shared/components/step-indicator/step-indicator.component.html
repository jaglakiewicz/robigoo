<div 
  class="step-indicator" 
  appScrollFade 
  [horizontal]="true" 
  appScrollCenter 
  [horizontal]="true" 
  [itemSelector]="'.step'">
  <div
    *ngFor="let step of steps; let i = index; trackBy: trackByFn"
    class="step"
    [class.active]="isActive(step)"
    [class.completed]="isCompleted(step)"
    [class.clickable]="clickable && !isDisabled(step)"
    [class.disabled]="isDisabled(step)"
    (click)="onStepClick(step)">
    <span class="step-number">{{ getStepNumber(i) }}</span>
    <span class="step-label">{{ step.label }}</span>
  </div>
</div>
