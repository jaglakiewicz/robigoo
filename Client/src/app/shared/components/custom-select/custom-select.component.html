<div class="custom-select" [class.open]="isOpen" [class.disabled]="disabled">
  <div class="select-trigger" (click)="toggle()">
    <span class="select-value" [class.placeholder]="!value">{{ selectedLabel }}</span>
    <span class="select-chevron" [innerHTML]="chevronIcon"></span>
  </div>
  
  <div class="select-dropdown" *ngIf="isOpen">
    <div 
      class="select-option" 
      *ngFor="let option of options"
      [class.selected]="option.value === value"
      (click)="selectOption(option)">
      {{ option.label }}
    </div>
  </div>
</div>
