<div class="entity-detail-panel">
  <div class="detail-header">
    <button class="back-btn" (click)="backClick.emit()" aria-label="Back to list" title="Back to list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detail-header-content">
      <div class="detail-title">{{ displayTitle }}</div>
      <div class="detail-sub" *ngIf="subtitle && !isNew">{{ subtitle }}</div>
    </div>
    
    <div class="detail-header-actions">
      <ng-container *ngTemplateOutlet="headerActionsTemplate"></ng-container>
      
      <button
        *ngIf="showHistory"
        class="btn btn-secondary btn-icon-only"
        [title]="historyButtonTitle"
        (click)="onHistoryClick()">
        <span [innerHTML]="historyIcon" style="color: inherit;"></span>
      </button>
    </div>
  </div>

  <div class="detail-content" #detailContent>
    <ng-content></ng-content>
  </div>
</div>
