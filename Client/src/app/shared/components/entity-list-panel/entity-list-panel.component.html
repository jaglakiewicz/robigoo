<div class="entity-list-panel">
  <div class="panel-header-row">
    <h4 class="panel-title" *ngIf="title">{{ title }}</h4>
  </div>

  <div class="filters-row">
    <input
      type="text"
      class="search-input"
      [placeholder]="searchPlaceholder"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
      aria-label="Search" />

    <app-filter-panel
      *ngIf="filterFields.length > 0"
      [fields]="filterFields"
      [values]="filterValues"
      [clearButtonLabel]="clearButtonLabel"
      [applyButtonLabel]="applyButtonLabel"
      (valuesChange)="onFilterChange($event)"
      (filterClear)="onFilterClear()"
      (openChange)="onFilterPanelOpenChange($event)">
    </app-filter-panel>
  </div>

  <div 
    class="entity-list" 
    [class.blurred]="blurOnFilterOpen && filterPanelOpen" 
    *ngIf="!loading; else loadingTpl"
    appScrollFade 
    appScrollCenter 
    [itemSelector]="'.' + itemClass">
    
    <div
      *ngFor="let item of items; trackBy: trackByFn"
      [class]="itemClass"
      [class.active]="isSelected(item)"
      role="button"
      [attr.tabindex]="0"
      (click)="onItemClick(item)"
      (keydown.enter)="onItemClick(item)"
      (keydown.space)="$event.preventDefault(); onItemClick(item)">
      <ng-container 
        *ngTemplateOutlet="itemTemplate; context: { $implicit: item, selected: isSelected(item) }">
      </ng-container>
    </div>

    <div *ngIf="items.length === 0" class="empty-state">
      {{ emptyMessage }}
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-state">{{ loadingMessage }}</div>
  </ng-template>
</div>
